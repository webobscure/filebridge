name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  integration:
    name: VS Code ${{ matrix.vscode }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Intel CI complements the locally exercised Apple Silicon installation.
        os: [ubuntu-24.04, windows-2022, macos-15-intel]
        vscode: ['1.90.0', stable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: test/requirements.txt
      - run: npm ci
      - run: python -m pip install -r test/requirements.txt
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Exercise real FTP/FTPS in the editor
        env:
          REMOTER_TEST_VSCODE_VERSION: ${{ matrix.vscode }}
          REMOTER_TEST_PYTHON: python
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run test:integration
          else
            npm run test:integration
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-${{ matrix.os }}-${{ matrix.vscode }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
  native:
    name: PhpStorm build and transport checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: test/requirements.txt
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - run: python -m pip install -r test/requirements.txt
      - run: python scripts/fetch-phpstorm.py
      - run: python jetbrains/build.py
      - run: python jetbrains/test.py --transport-only
      - run: python scripts/verify-phpstorm.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phpstorm-package
          path: filebridge-phpstorm-*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-phpstorm
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
  packages:
    name: Assemble release files
    needs: [integration, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run package
      - run: npm run package:migration
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phpstorm-package
          path: .
      - run: npm run release:collect
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: filebridge-release
          path: release/
          if-no-files-found: error
          retention-days: 30
